<!DOCTYPE html>
<html>
<head>
    <title>Login - SkillSync</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .card { background:white; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:350px; }
        input { width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:6px; }
        button { width:100%; padding:12px; background:#111; color:white; border:none; border-radius:6px; cursor:pointer; font-size:16px; }
        h2 { margin:0 0 20px 0; text-align:center; }
    </style>
</head>
<body>
<div class="card">
    <h2>SkillSync Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</div>
{% include 'accounts/footer.html' %}
</body>
</html>
